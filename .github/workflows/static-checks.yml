name: Static checks

on:
  push:
    branches: [main, anicard-security-hardening-clean]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: |
          python -m compileall -q admin.py bot.py config.py database.py gacha.py import_anilist.py import_characters.py run.py seed.py server.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check frontend/js/app.js
          node --check frontend/js/admin.js
